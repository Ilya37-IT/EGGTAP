<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egg Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            user-select: none;
            overflow: hidden; /* Запрещаем прокрутку */
        }

        /* Экраны приложения */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Кнопка магазина (на главном экране) */
        .shop-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: transform 0.1s, background 0.2s;
        }

        .shop-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Элементы игры */
        .egg {
            font-size: 150px;
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .egg:active {
            transform: scale(0.9);
        }

        .egg.clicked {
            animation: bounce 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .counter {
            margin-top: 40px;
            font-size: 56px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .label {
            margin-top: 5px;
            font-size: 18px;
            opacity: 0.8;
        }

        .power-info {
            margin-top: 15px;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 12px;
        }

        /* Элементы магазина */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .shop-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .shop-item-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .shop-item-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .shop-item-desc {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .buy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }

        .buy-btn:active {
            transform: scale(0.95);
        }

        .buy-btn.disabled {
            background: #666;
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ИГРЫ -->
    <div id="game-screen" class="screen active">
        <button class="shop-btn" onclick="showShop()">🛒 Shop</button>
        
        <div class="egg" id="egg">🥚</div>
        <div class="counter" id="counter">0</div>
        <div class="label">всего кликов</div>
        <div class="power-info">Сила клика: +<span id="power-display">1</span></div>
    </div>

    <!-- ЭКРАН МАГАЗИНА -->
    <div id="shop-screen" class="screen">
        <button class="back-btn" onclick="showGame()">← Назад</button>
        
        <div class="shop-title">Магазин</div>
        
        <div class="shop-item">
            <div class="shop-item-icon">⚡</div>
            <div class="shop-item-name">Двойной удар</div>
            <div class="shop-item-desc">Увеличивает силу клика. Теперь каждое нажатие на яйцо будет приносить +2 очка вместо +1.</div>
            <button class="buy-btn" id="buy-btn" onclick="buyUpgrade()">Купить за 500</button>
        </div>
    </div>

    <script>
        // 1. Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.ready();

        // 2. Загрузка данных из памяти телефона (или установка значений по умолчанию)
        let score = parseInt(localStorage.getItem('eggScore')) || 0;
        let clickPower = parseInt(localStorage.getItem('eggClickPower')) || 1;
        const upgradePrice = 500;

        // Элементы DOM
        const counterEl = document.getElementById('counter');
        const powerDisplayEl = document.getElementById('power-display');
        const eggEl = document.getElementById('egg');
        const buyBtnEl = document.getElementById('buy-btn');

        // 3. Функция обновления интерфейса
        function updateUI() {
            counterEl.textContent = score;
            powerDisplayEl.textContent = clickPower;
            
            // Проверяем, хватает ли денег на улучшение
            if (score >= upgradePrice) {
                buyBtnEl.classList.remove('disabled');
                buyBtnEl.textContent = `Купить за ${upgradePrice}`;
            } else {
                buyBtnEl.classList.add('disabled');
                buyBtnEl.textContent = `Не хватает (${score}/${upgradePrice})`;
            }
        }

        // 4. Функция сохранения данных
        function saveData() {
            localStorage.setItem('eggScore', score);
            localStorage.setItem('eggClickPower', clickPower);
        }

        // 5. Логика клика по яйцу
        eggEl.addEventListener('click', function() {
            score += clickPower; // Добавляем текущую силу клика
            saveData();
            updateUI();
            
            // Анимация
            eggEl.classList.add('clicked');
            setTimeout(() => {
                eggEl.classList.remove('clicked');
            }, 300);

            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // 6. Логика покупки в магазине
        function buyUpgrade() {
            if (score >= upgradePrice) {
                score -= upgradePrice; // Списываем средства
                clickPower += 1;       // Увеличиваем силу клика (было 1, стало 2)
                saveData();
                updateUI();
                
                // Уведомление от Telegram
                tg.showPopup({
                    title: 'Успешно! 🎉',
                    message: 'Вы купили "Двойной удар"! Теперь каждый клик дает больше очков.',
                    buttons: [{type: 'ok'}]
                });
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                // Уведомление, если не хватает денег
                tg.showPopup({
                    title: 'Недостаточно средств',
                    message: `Для покупки нужно ${upgradePrice} кликов. Продолжай кликать!`,
                    buttons: [{type: 'ok'}]
                });
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }
        }

        // 7. Переключение экранов
        function showShop() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('shop-screen').classList.add('active');
            updateUI(); // Обновляем кнопку магазина при открытии
        }

        function showGame() {
            document.getElementById('shop-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }

        // Запуск при загрузке
        updateUI();
    </script>
</body>
</html>
